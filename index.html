<script>
'use strict';
/* =========================================================
   ALL STAR FIGHT — moteur de base
   ========================================================= */
const W = 480, H = 270;
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- Canvases ---------- */
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
const gbuf = mk(W, H), g = gbuf.getContext('2d');       // monde pixel
const fbuf = mk(W, H), fx = fbuf.getContext('2d');      // effets lumineux (additifs)
const bbuf = mk(W / 3, H / 3), bctx = bbuf.getContext('2d'); // bloom
const bbuf2 = mk(W / 8, H / 8), bctx2 = bbuf2.getContext('2d');
let SC = 1, OX = 0, OY = 0, DPR = 1;
function resize() {

  const w = window.innerWidth, h = window.innerHeight;
  cvs.width = Math.round(w * DPR); cvs.height = Math.round(h * DPR);

}
window.addEventListener('resize', resize); resize();

const F = { disp: '"Bungee", "Impact", "Arial Black", sans-serif', ui: '"Chakra Petch", "Trebuchet MS", "Segoe UI", sans-serif', px: '"Silkscreen", "Courier New", monospace' };

/* ---------- Réglages ---------- */
const ACTIONS = ['up', 'down', 'left', 'right', 'atk', 'jump', 'dash', 'skill', 'super', 'assist', 'start'];
const ACTION_NAMES = { up: 'Haut', down: 'Bas / Garde', left: 'Gauche', right: 'Droite', atk: 'Attaque', jump: 'Saut', dash: 'Dash', skill: 'Technique', super: 'Ultime / Charger', assist: 'Assist', start: 'Pause' };
const DEFAULT_KEYS = [
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', atk: 'KeyJ', jump: 'KeyK', dash: 'KeyL', skill: 'KeyU', super: 'KeyI', assist: 'KeyO', start: 'Enter' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', atk: 'Numpad1', jump: 'Numpad2', dash: 'Numpad3', skill: 'Numpad4', super: 'Numpad5', assist: 'Numpad6', start: 'NumpadEnter' }
];
const SKEY = 'crossworld-vs-settings-v1';
const settings = { rounds: 2, time: 60, diff: 1, shake: true, music: 0.45, sfx: 0.7, keys: JSON.parse(JSON.stringify(DEFAULT_KEYS)) };

/* ---------- Libellés de touches (AZERTY friendly) ---------- */
let layoutMap = null;
try { if (navigator.keyboard && navigator.keyboard.getLayoutMap) navigator.keyboard.getLayoutMap().then(m => layoutMap = m).catch(() => { }); } catch (e) { }
const isFr = (navigator.language || '').toLowerCase().startsWith('fr');
const AZ = { KeyQ: 'A', KeyW: 'Z', KeyA: 'Q', KeyZ: 'W', KeyM: ',', Semicolon: 'M' };
function keyLabel(code) {
  if (!code) return '—';
  if (layoutMap && layoutMap.get(code)) return layoutMap.get(code).toUpperCase();
  if (isFr && AZ[code]) return AZ[code];
  const m = { ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Space: 'ESPACE', Enter: 'ENTRÉE', NumpadEnter: 'PAV.ENTRÉE', ShiftLeft: 'MAJ G', ShiftRight: 'MAJ D', ControlLeft: 'CTRL G', ControlRight: 'CTRL D', Backspace: 'RETOUR', Escape: 'ÉCHAP' };
  if (m[code]) return m[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'PAV.' + code.slice(6);

}

/* ---------- Entrées ---------- */
function newPS() { const o = { cur: {}, prev: {}, buf: {}, kb: {}, kbPrev: {}, rep: {} }; ACTIONS.forEach(a => { o.cur[a] = o.prev[a] = o.kb[a] = o.kbPrev[a] = false; o.buf[a] = -99; o.rep[a] = 0; }); return o; }
const Input = {
  down: new Set(), tap: new Set(), frame: 0, p: [newPS(), newPS()], lastCode: null, sys: {}, sysPrev: {}, padPrev: [[], []],
  mouse: { x: -1, y: -1, click: false, moved: false, down: false }, anyKey: false,
  padState(i) { try { const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; return pads[i] || null; } catch (e) { return null; } },
  padAct(pad, a) {
    const b = i => pad.buttons[i] && pad.buttons[i].pressed; const ax = pad.axes || [];

      case 'up': return b(12) || ax[1] < -0.5; case 'down': return b(13) || ax[1] > 0.5;
      case 'left': return b(14) || ax[0] < -0.5; case 'right': return b(15) || ax[0] > 0.5;
      case 'atk': return b(2); case 'jump': return b(0); case 'dash': return b(1); case 'skill': return b(3);

  },
  update() {

        const v = ps.kb[a] || (pad ? this.padAct(pad, a) : false);
        ps.cur[a] = v;
        if (v && !ps.prev[a]) ps.buf[a] = this.frame;
        ps.rep[a] = v ? ps.rep[a] + 1 : 0;
      }
      const pb = pad ? pad.buttons.map(b => b.pressed) : [];

      ps.padConfirm = pad && ((pb[0] && !pp[0]) || (pb[9] && !pp[9]));
      ps.padBack = pad && (pb[1] && !pp[1]);
      this.padPrev[pi] = pb;
    }
    const k = c => this.down.has(c) || this.tap.has(c);
    const s = { confirm: k('Enter') || k('Space') || k('NumpadEnter'), back: k('Escape') || k('Backspace'), pause: k('Escape') || k('KeyP') };
    const e = {};
    for (const n in s) e[n] = s[n] && !this.sysPrev[n];
    this.sysPrev = s;
    const P = this.p;
    this.kConfirm = e.confirm; this.kBack = e.back;
    this.confirm = e.confirm || [0, 1].some(i => (P[i].kb.atk && !P[i].kbPrev.atk) || P[i].padConfirm);
    this.back = e.back || [0, 1].some(i => (P[i].kb.jump && !P[i].kbPrev.jump) || P[i].padBack);

  },
  endFrame() { this.tap.clear(); this.mouse.click = false; this.lastCode = null; this.anyKey = false; },
  held(pi, a) { return this.p[pi].cur[a]; },
  pressed(pi, a) { const p = this.p[pi]; return p.cur[a] && !p.prev[a]; },
  buffered(pi, a, n = 5) { return this.frame - this.p[pi].buf[a] <= n; },
  consume(pi, a) { this.p[pi].buf[a] = -99; },
  // navigation menu (avec répétition)
  nav(pi) {
    const p = this.p[pi], r = a => p.cur[a] && (p.rep[a] === 1 || (p.rep[a] > 18 && p.rep[a] % 5 === 0));

  },
  navAny() { const a = this.nav(0), b = this.nav(1); return { x: a.x || b.x, y: a.y || b.y }; },
  confirmP(pi) { const p = this.p[pi]; return !!((p.kb.atk && !p.kbPrev.atk) || p.padConfirm || (pi === 0 && this.kConfirm)); },
  backP(pi) { const p = this.p[pi]; return !!((p.kb.jump && !p.kbPrev.jump) || p.padBack || (pi === 0 && this.kBack)); }
};
const gameCodes = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace']);
window.addEventListener('keydown', e => {
  if (!e.repeat) { Input.down.add(e.code); Input.tap.add(e.code); Input.lastCode = e.code; Input.anyKey = true; }
  if (gameCodes.has(e.code) || e.code.startsWith('Numpad')) e.preventDefault();
  AU.unlock();
});
window.addEventListener('keyup', e => { Input.down.delete(e.code); });
window.addEventListener('blur', () => Input.down.clear());
function toGame(ev) { const r = cvs.getBoundingClientRect(); return [((ev.clientX - r.left) * DPR - OX) / SC, ((ev.clientY - r.top) * DPR - OY) / SC]; }
cvs.addEventListener('pointermove', e => { const [x, y] = toGame(e); Input.mouse.x = x; Input.mouse.y = y; Input.mouse.moved = true; });
cvs.addEventListener('pointerdown', e => { const [x, y] = toGame(e); Input.mouse.x = x; Input.mouse.y = y; Input.mouse.click = true; Input.anyKey = true; AU.unlock(); try { cvs.focus(); } catch (er) { } });

/* ---------- Audio (synthèse) ---------- */
const AU = {
  c: null, sg: null, mg: null, nb: null,

  },
  applyVol() { try { Music.duck(1); } catch (e) { } if (!this.c) return; this.sg.gain.value = settings.sfx; this.mg.gain.value = settings.music * 0.85; },
  tone(f, d, o = {}) {

  },
  noise(d, o = {}) {

};
const SFX = {
  hit() { AU.noise(.12, { v: .55, f: 2600, f2: 500 }); AU.tone(180, .09, { v: .16, f2: 60 }); },
  heavy() { AU.noise(.28, { v: .8, f: 2000, f2: 150 }); AU.tone(110, .25, { type: 'sine', v: .5, f2: 35 }); },
  slash() { AU.noise(.13, { v: .3, type: 'bandpass', f: 1800, f2: 7000, q: .8 }); },
  whoosh() { AU.noise(.2, { v: .18, type: 'bandpass', f: 500, f2: 2600, q: 1.2 }); },
  jump() { AU.tone(260, .1, { type: 'triangle', v: .12, f2: 520 }); },
  land() { AU.noise(.08, { v: .2, f: 600, f2: 200 }); },
  guard() { AU.tone(980, .12, { type: 'triangle', v: .15 }); AU.tone(1470, .1, { type: 'triangle', v: .1 }); AU.noise(.06, { v: .2, type: 'highpass', f: 3000 }); },
  dash() { AU.noise(.16, { v: .2, type: 'bandpass', f: 3000, f2: 600, q: 2 }); AU.tone(1400, .08, { type: 'sine', v: .06, f2: 300 }); },
  proj() { AU.tone(520, .2, { type: 'sawtooth', v: .1, f2: 180 }); AU.noise(.2, { v: .2, type: 'bandpass', f: 1200, f2: 400 }); },
  beam() { AU.tone(90, 1.2, { type: 'sawtooth', v: .25, f2: 60 }); AU.tone(180, 1.2, { type: 'square', v: .08, f2: 140 }); AU.noise(1.2, { v: .35, f: 900, f2: 300 }); },
  boom() { AU.noise(.6, { v: .9, f: 1500, f2: 80 }); AU.tone(70, .5, { type: 'sine', v: .6, f2: 25 }); },
  elec() { for (let i = 0; i < 4; i++) AU.noise(.05, { v: .3, type: 'highpass', f: 2500, delay: i * .03 }); AU.tone(60, .2, { type: 'square', v: .1 }); },
  select() { AU.tone(880, .06, { type: 'square', v: .08 }); AU.tone(1320, .09, { type: 'square', v: .08, delay: .05 }); },
  move() { AU.tone(660, .03, { type: 'square', v: .05 }); },
  back() { AU.tone(440, .06, { type: 'square', v: .07, f2: 300 }); },
  super() { AU.tone(200, .6, { type: 'sawtooth', v: .18, f2: 1600 }); AU.noise(.6, { v: .3, type: 'highpass', f: 800, f2: 6000 }); AU.tone(1600, .5, { type: 'sine', v: .1, delay: .35, f2: 2400 }); },
  charge() { AU.tone(120 + Math.random() * 30, .12, { type: 'sawtooth', v: .04 }); },
  teleport() { AU.tone(1600, .14, { type: 'sine', v: .12, f2: 200 }); },
  ko() { AU.noise(1, { v: .9, f: 3000, f2: 60 }); AU.tone(90, 1, { type: 'sine', v: .6, f2: 30 }); AU.tone(440, .6, { type: 'sawtooth', v: .1, f2: 110, delay: .1 }); },
  round() { [523, 659, 784].forEach((f, i) => AU.tone(f, .14, { type: 'square', v: .08, delay: i * .07 })); },
  fight() { AU.tone(392, .1, { type: 'square', v: .1 }); AU.tone(784, .35, { type: 'square', v: .1, delay: .1 }); AU.noise(.3, { v: .3, f: 4000, f2: 500, delay: .1 }); },
  vs() { AU.noise(.5, { v: .6, f: 2500, f2: 120 }); AU.tone(55, .6, { type: 'sine', v: .5, f2: 30 }); },
  fanfare() { if (!AU.c) return; SY.init(); const t = AU.c.currentTime + .05, q = .12; [[72, 0], [76, 1], [79, 2], [84, 3], [84, 5]].forEach(([n, k], i) => { SY.lead(t + k * q, n, i === 4 ? .9 : q * .95, 1.6); SY.gtr(t + k * q, n - 24, i === 4 ? .9 : q, false); }); SY.crash(t + 5 * q); SY.kick(t + 5 * q); }
};
function sfx(n) { try { SFX[n] && SFX[n](); } catch (e) { } }

/* ---------- Musique : moteur "anime battle" (batterie, guitare saturée, basse, lead) ---------- */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SY = {

    this.rev = c.createConvolver(); this.rev.buffer = ir; this.revIn = c.createGain(); this.revIn.gain.value = .2; this.revIn.connect(this.rev); this.rev.connect(this.out);

  env(g, t, a, v, d, rel = .05) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.setValueAtTime(v, t + Math.max(a + .001, d - rel)); g.gain.exponentialRampToValueAtTime(.0001, t + d); },

  snare(t, v = 1) { AU.noise(.17, { v: .55 * v, type: 'bandpass', f: 1900, q: .6, at: t, bus: this.out }); AU.noise(.22, { v: .2 * v, type: 'bandpass', f: 2200, q: .6, at: t, bus: this.revIn }); const g = AU.c.createGain(); this.env(g, t, .002, .32 * v, .1); g.connect(this.out); const o = this.osc('triangle', 220, t, .12, g); o.frequency.exponentialRampToValueAtTime(150, t + .08); },

const STAGE_W = 900, GROUND = 380, CAM_MAXT = 132;
function pdisc(c, cx, cy, r, col) { c.fillStyle = col; for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) { const dy = y + .5 - cy, s = r * r - dy * dy; if (s < 0) continue; const dx = Math.sqrt(s), x0 = Math.round(cx - dx), x1 = Math.round(cx + dx); if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1); } }
function ppoly(c, pts, col) {
  c.fillStyle = col; let y0 = Infinity, y1 = -Infinity; for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const sy = y + .5, xs = [];
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const a = pts[i], b = pts[j]; if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + (sy - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
    xs.sort((a, b) => a - b); for (let k = 0; k + 1 < xs.length; k += 2) { const a = Math.round(xs[k]), b = Math.round(xs[k + 1]); if (b > a) c.fillRect(a, y, b - a, 1); }
  }
}
function dithDisc(c, cx, cy, r, col, step = 2, sy = 1) { c.fillStyle = col; for (let y = Math.floor(-r * sy); y <= r * sy; y++) for (let x = Math.floor(-r); x <= r; x++) { if (((x + y) & 1) || (step > 2 && (x % step))) continue; if ((x * x) / (r * r) + (y * y) / (r * r * sy * sy) <= 1) c.fillRect(Math.floor(cx + x), Math.floor(cy + y), 1, 1); } }
function dith(c, x, y, w, h, col, step = 2) { c.fillStyle = col; for (let yy = 0; yy < h; yy++) for (let xx = (yy % 2); xx < w; xx += step) c.fillRect(x + xx, y + yy, 1, 1); }
function layerCanvas(f) { return mk(W + (STAGE_W - W) * f + 2, H + CAM_MAXT * f + 2); }
const gyL = f => 248 + CAM_MAXT * f; // ligne du sol dans l'espace d'un calque
function stars(c, R, n, w, h, cols) { for (let i = 0; i < n; i++) { c.fillStyle = pick2(R, cols); c.fillRect(Math.floor(R() * w), Math.floor(R() * h), 1, 1); } }
function pick2(R, a) { return a[Math.floor(R() * a.length)]; }
function roofTiles(c, x, y, w, h, base, hi, lo) {
  c.fillStyle = base; c.fillRect(x, y, w, h);
  for (let yy = y; yy < y + h; yy += 6) { const off = ((yy / 6) % 2) * 4; for (let xx = x - 8 + off; xx < x + w; xx += 8) { c.fillStyle = hi; c.fillRect(xx + 1, yy, 6, 1); c.fillRect(xx, yy + 1, 1, 3); c.fillStyle = lo; c.fillRect(xx + 7, yy + 1, 1, 4); c.fillRect(xx + 1, yy + 5, 6, 1); } }
}
function clipPoly(c, pts, fn) { c.save(); c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.clip(); fn(); c.restore(); }
